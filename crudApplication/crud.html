<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVC CRUD Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h4 class="card-title mb-4">Database Entry</h4>
            <div id="fields" class="row g-3"></div>
            <div class="mt-4">
                <button onclick="handleSave()" class="btn btn-primary">Save
                </button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <div id="tableContainer"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const API_BASE = "/nageswari"; 

    // --- MVC STATE (The Model) ---
    let appState = {
        columnNames: [],
        rows: [],
        idColumn: ""
    };

    // 1. FETCH DATA (Controller)
    async function loadData() {
        try {
            const response = await fetch(`${API_BASE}/showAll`);
            const data = await response.json();
            
            // Store data in our state variable (The Model)
            appState.columnNames = data.columns;
            appState.rows = data.rows;
            appState.idColumn = data.columns[0];

            renderInputs(); // Update View
            renderTable();  // Update View
        } catch (err) {
            console.error("Connection error:", err);
        }
    }

    // 2. RENDER INPUTS (View)
    function renderInputs() {
        let html = "";
        appState.columnNames.forEach(col => {
            html += `
                <div class="col-md-4">
                    <label class="form-label fw-bold">${col}</label>
                    <input type="text" id="field_${col}" class="form-control">
                </div>`;
        });
        document.getElementById("fields").innerHTML = html;
    }

    // 3. RENDER TABLE (View)
    function renderTable() {
        let html = `
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>`;
        
        appState.columnNames.forEach(col => html += `<th>${col}</th>`);
        html += `<th class="text-center">Actions</th></tr></thead><tbody>`;

        appState.rows.forEach((row, index) => {
            html += `<tr>`;
            appState.columnNames.forEach(col => html += `<td>${row[col]}</td>`);
            
            // Use Pen and Bin icons
            html += `
                <td class="text-center">
                    <button class="btn btn-outline-primary btn-sm me-2" onclick="populateFields(${index})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-outline-danger btn-sm" onclick="handleDelete('${row[appState.idColumn]}')">
                        <i class="bi bi-trash"></i>
                    </button>
                </td></tr>`;
        });
        
        document.getElementById("tableContainer").innerHTML = html + '</tbody></table>';
    }

    // 4. SAVE LOGIC (Controller)
    async function handleSave() {
        const params = new URLSearchParams();
        appState.columnNames.forEach(col => {
            params.append(col, document.getElementById("field_" + col).value);
        });

        const response = await fetch(`${API_BASE}/save?` + params.toString());
        if (await response.text() === "1") {
            loadData(); // Re-fetch and re-render
            clearForm();
        }
    }

    // 5. DELETE LOGIC (Controller)
    async function handleDelete(id) {
        if (!confirm(`Are you sure you want to delete ID: ${id}?`)) return;
        
        const response = await fetch(`${API_BASE}/delete?id=${id}`);
        if (await response.text() === "1") {
            loadData(); // Re-fetch and re-render
        }
    }

    // HELPER FUNCTIONS
    function populateFields(rowIndex) {
        const rowData = appState.rows[rowIndex];
        appState.columnNames.forEach(col => {
            document.getElementById("field_" + col).value = rowData[col];
        });
    }

    function clearForm() {
        appState.columnNames.forEach(col => {
            document.getElementById("field_" + col).value = "";
        });
    }

    // Initial Start
    loadData();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
